name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday, so new advisories show up even without changes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust advisories (cargo audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities. Warnings (unmaintained or unsound crates,
      # today all deep in Tauri's GTK stack and the keyring's D-Bus crates)
      # are shown in the log and followed up through Dependabot.
      - run: cargo audit

  npm-audit:
    name: npm advisories (npm audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
