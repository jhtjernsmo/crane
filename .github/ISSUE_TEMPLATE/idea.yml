name: Idea
description: Something Crane could do
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then any solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
  - type: textarea
    id: security
    attributes:
      label: Does it touch secrets, files, the network or containers?
      description: If so, how should it stay safe?
