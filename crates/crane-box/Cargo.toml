[package]
name = "crane-box"
description = "Crane's own rootless container engine: pulls images and runs them in Linux namespaces"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
toml = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["fs", "hostname", "mount", "net", "process", "sched", "signal", "socket", "uio", "user", "ioctl", "poll"] }

[dev-dependencies]
tempfile = "3"
nix = { version = "0.31", features = ["signal"] }
