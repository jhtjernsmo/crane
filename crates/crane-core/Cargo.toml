[package]
name = "crane-core"
description = "Sends HTTP requests for Crane and measures them"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "0.13", features = ["socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = { version = "4", optional = true }
regex = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "fs"] }
tower-layer = "0.3"
tower-service = "0.3"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
tokio-rustls = "0.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["keyring"]
# The system keyring for secrets (Secret Service, Keychain, Credential Manager).
keyring = ["dep:keyring"]
